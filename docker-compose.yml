services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      CATALOG_PATH: "/data/catalog/products.json"
      SITE_URL: "${SITE_URL:-https://karahanligida.com}"
      WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-}"
      FIREBASE_WEB_API_KEY: "${FIREBASE_WEB_API_KEY:-}"
      FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_WEB_APP_ID: "${FIREBASE_WEB_APP_ID:-}"
      APP_RELEASE: "${APP_RELEASE:-local}"
    volumes:
      - ${KARAHANLI_BASE_DIR:-/srv/karahanli}/data/catalog:/data/catalog:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  admin-api:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PORT: "3100"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase_service_account"
      ADMIN_ORIGIN: "${ADMIN_ORIGIN}"
      MEDIA_ROOT: "/data/media"
      CATALOG_PATH: "/data/catalog/products.json"
    volumes:
      - ${KARAHANLI_BASE_DIR:-/srv/karahanli}/data/media:/data/media
      - ${KARAHANLI_BASE_DIR:-/srv/karahanli}/data/catalog:/data/catalog
    secrets:
      - firebase_service_account
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  firebase_service_account:
    file: "${FIREBASE_SERVICE_ACCOUNT_FILE:-./secrets/firebase-service-account.unconfigured.json}"
