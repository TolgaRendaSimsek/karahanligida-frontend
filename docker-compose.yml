services:
  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PORT: "3100"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase_service_account"
      ADMIN_ORIGIN: "${ADMIN_ORIGIN}"
      MEDIA_ROOT: "/data/media"
      CATALOG_PATH: "/data/catalog/products.json"
      GENERATED_PAGES_ROOT: "/data/generated/urunler"
    volumes:
      - /srv/karahanli/data/media:/data/media
      - /srv/karahanli/data/catalog:/data/catalog
      - /srv/karahanli/data/generated:/data/generated
    secrets:
      - firebase_service_account
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  firebase_service_account:
    file: "${FIREBASE_SERVICE_ACCOUNT_FILE}"
